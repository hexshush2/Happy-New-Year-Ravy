<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMO New Year Adventure 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Press Start 2P', cursive;
  background: #222;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

body::before {
  content:"";
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 20px 20px;
  z-index:-1;
}

.bmo-screen {
  background: #88d8b0;
  width: 400px;
  max-width: 90vw;
  height: 600px;
  max-height: 90vh;
  border: 12px solid #4a9c8c;
  border-radius: 20px;
  padding: 20px;
  box-sizing: border-box;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  box-shadow: 0 0 20px #0f4c3d;
  image-rendering: pixelated;
  color: #fff;
}

.save-file {
  margin-bottom: 10px;
  text-align: left;
  width: 100%;
}

input[type="text"] {
  width: 100%;
  font-family: 'Press Start 2P', cursive;
  font-size: 14px;
  padding: 5px;
  margin-top: 5px;
  border: 2px solid #4a9c8c;
  border-radius: 5px;
  background: #c4f0e6;
}

.enter-btn {
  margin-top: 10px;
  font-family: 'Press Start 2P', cursive;
  font-size: 12px;
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background-color: #ffd6a5;
}

.welcome-msg {
  display: none;
  text-align: center;
  margin: 20px 0;
  font-size: 12px;
}

.blinking {
  animation: blink 1s infinite;
}

@keyframes blink {
  0%,50%,100% {opacity:1;}
  25%,75% {opacity:0;}
}

.question {
  margin-top: 20px;
  font-size: 10px;
  text-align: center;
}

.buttons {
  display: flex;
  justify-content: space-around;
  width: 100%;
  margin-top: auto;
  position: relative;
  height: 60px;
}

button.choice {
  font-family: 'Press Start 2P', cursive;
  font-size: 12px;
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background-color: #ffd6a5;
  transition: all 0.2s;
  position: relative;
}

.progress-bar {
  width: 100%;
  background: #b2f7ef;
  height: 10px;
  border-radius: 5px;
  overflow: hidden;
  margin-bottom: 10px;
}

.progress {
  height: 100%;
  width: 0%;
  background: #ffaaa5;
  transition: width 2s;
}

/* BMO face */
.bmo-face {
  width: 120px;
  height: 120px;
  background: #4fc3a1;
  border: 4px solid #4a9c8c;
  border-radius: 15px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  margin: 10px 0;
}
.bmo-eye {
  width: 20px;
  height: 20px;
  background: #000;
  border-radius: 50%;
  margin: 5px;
}
.bmo-mouth {
  width: 40px;
  height: 10px;
  background: #000;
  border-radius: 5px;
  margin-top: 5px;
}
</style>
</head>
<body>

<div class="bmo-screen">
  <div class="save-file">
    <div>SAVE FILE 01: NEW YEAR 2026</div>
    <div>PLAYER:</div>
    <input type="text" id="playerName" placeholder="Enter your name">
    <button class="enter-btn" id="enterBtn">ENTER</button>
    <div>COMPANION: BMO</div>
    <div class="progress-bar"><div class="progress" id="progress"></div></div>
  </div>

  <div class="bmo-face">
    <div class="bmo-eye"></div>
    <div class="bmo-eye"></div>
    <div class="bmo-mouth"></div>
  </div>

  <div class="welcome-msg blinking" id="welcomeMsg">I’VE LONG BEEN WAITING FOR YOU</div>

  <div class="question" id="questionText" style="display:none;">
    DO YOU WANT TO START NOW, <span id="playerDisplay"></span>?
  </div>

  <div class="buttons" id="buttonContainer" style="display:none;">
    <button class="choice" id="yesBtn">YES</button>
    <button class="choice" id="noBtn">NO</button>
  </div>
</div>

<script>
// Web Audio API beep
function beep(volume, frequency, duration){
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  oscillator.type = 'square';
  oscillator.frequency.value = frequency;
  gainNode.gain.value = volume;
  oscillator.start();
  oscillator.stop(audioCtx.currentTime + duration/1000);
}

// Elements
const playerInput = document.getElementById('playerName');
const enterBtn = document.getElementById('enterBtn');
const welcomeMsg = document.getElementById('welcomeMsg');
const progress = document.getElementById('progress');
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const questionText = document.getElementById('questionText');
const buttonContainer = document.getElementById('buttonContainer');
const playerDisplay = document.getElementById('playerDisplay');

// Play beep on typing
playerInput.addEventListener('keydown', ()=> beep(0.2, 600, 50));

// ENTER button starts adventure and plays beep
function startAdventure(){
  if(playerInput.value.trim() !== ''){
    playerDisplay.textContent = playerInput.value.trim();
