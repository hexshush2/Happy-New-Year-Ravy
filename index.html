<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMO New Year Adventure 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Press Start 2P', cursive;
  background: #222;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

/* Pixel grid background for Switch vibe */
body::before {
  content:"";
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 20px 20px;
  z-index:-1;
}

/* Sparkle animation */
@keyframes sparkle {
  0% {opacity:0; transform: scale(0.5);}
  50% {opacity:1; transform: scale(1);}
  100% {opacity:0; transform: scale(0.5);}
}
.sparkle {
  position: absolute;
  width: 6px;
  height: 6px;
  background: #fff;
  border-radius: 50%;
  animation: sparkle 1s infinite;
}

/* BMO face container */
.bmo-screen {
  width: 400px;
  max-width: 90vw;
  height: 600px;
  max-height: 90vh;
  border-radius: 20px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  background-image: url('https://raw.githubusercontent.com/hexshush2/Happy-New-Year-Ravy/main/bmo-face.jpg');
  background-size: cover;
  background-position: center;
  box-shadow: 0 0 20px #0f4c3d;
  padding: 20px;
  box-sizing: border-box;
  color: #fff;
}

/* Screen area */
.save-file {
  background: rgba(0,0,0,0.4);
  width: 90%;
  padding: 10px;
  border-radius: 10px;
  margin-top: 20px;
  text-align: left;
}

input[type="text"] {
  width: 100%;
  font-family: 'Press Start 2P', cursive;
  font-size: 14px;
  padding: 5px;
  margin-top: 5px;
  border: 2px solid #4a9c8c;
  border-radius: 5px;
  background: #c4f0e6;
}

.enter-btn {
  margin-top: 10px;
  font-family: 'Press Start 2P', cursive;
  font-size: 12px;
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background-color: #ffd6a5;
}

.progress-bar {
  width: 100%;
  background: #b2f7ef;
  height: 10px;
  border-radius: 5px;
  overflow: hidden;
  margin-top: 10px;
}
.progress {
  height: 100%;
  width: 0%;
  background: #ffaaa5;
  transition: width 2s;
}

.welcome-msg {
  display: none;
  text-align: center;
  font-size: 12px;
  margin-top: 15px;
}
.blinking { animation: blink 1s infinite; }
@keyframes blink { 0%,50%,100% {opacity:1;} 25%,75% {opacity:0;} }

.question {
  display: none;
  margin-top: 20px;
  font-size: 10px;
  text-align: center;
}

.buttons {
  display: none;
  justify-content: space-around;
  width: 100%;
  margin-top: auto;
  position: relative;
  height: 60px;
}
button.choice {
  font-family: 'Press Start 2P', cursive;
  font-size: 12px;
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background-color: #ffd6a5;
  transition: all 0.2s;
  position: relative;
}
</style>
</head>
<body>

<div class="bmo-screen">
  <div class="save-file">
    <div>SAVE FILE 01: NEW YEAR 2026</div>
    <div>PLAYER:</div>
    <input type="text" id="playerName" placeholder="Enter your name">
    <button class="enter-btn" id="enterBtn">ENTER</button>
    <div class="progress-bar"><div class="progress" id="progress"></div></div>
  </div>

  <div class="welcome-msg blinking" id="welcomeMsg">I’VE LONG BEEN WAITING FOR YOU</div>

  <div class="question" id="questionText">
    DO YOU WANT TO START NOW, <span id="playerDisplay"></span>?
  </div>

  <div class="buttons" id="buttonContainer">
    <button class="choice" id="yesBtn">YES</button>
    <button class="choice" id="noBtn">NO</button>
  </div>
</div>

<!-- Background music (replace with your file later) -->
<audio id="bgMusic" loop>
  <source src="love-like-you.mp3" type="audio/mpeg">
</audio>

<script>
// Web Audio API beep for typing & buttons
function beep(volume, frequency, duration){
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  oscillator.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  oscillator.type = 'square';
  oscillator.frequency.value = frequency;
  gainNode.gain.value = volume;
  oscillator.start();
  oscillator.stop(audioCtx.currentTime + duration/1000);
}

// Sparkle animation
function createSparkle() {
  const sparkle = document.createElement('div');
  sparkle.classList.add('sparkle');
  sparkle.style.left = Math.random() * window.innerWidth + 'px';
  sparkle.style.top = Math.random() * window.innerHeight + 'px';
  document.body.appendChild(sparkle);
  setTimeout(()=> sparkle.remove(), 1000);
}
setInterval(createSparkle, 300);

// Elements
const playerInput = document.getElementById('playerName');
const enterBtn = document.getElementById('enterBtn');
const welcomeMsg = document.getElementById('welcomeMsg');
const progress = document.getElementById('progress');
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const questionText = document.getElementById('questionText');
const buttonContainer = document.getElementById('buttonContainer');
const playerDisplay = document.getElementById('playerDisplay');
const bgMusic = document.getElementById('bgMusic');

// Typing beep
playerInput.addEventListener('keydown', ()=> beep(0.2, 600, 50));

// Start adventure
function startAdventure(){
  if(playerInput.value.trim() !== ''){
    playerDisplay.textContent = playerInput.value.trim();
    welcomeMsg.style.display = 'block';
    questionText.style.display = 'block';
    buttonContainer.style.display = 'flex';
    progress.style.width = '100%';
    beep(0.3, 400, 100);
    bgMusic.play().catch(()=>{});
  }
}
enterBtn.addEventListener('click', startAdventure);
playerInput.addEventListener('keydown', e=>{ if(e.key==='Enter') startAdventure(); });

// NO button moves with beep
function moveNoButton(){
  beep(0.3, 800, 100);
  const container = document.querySelector('.bmo-screen');
  const maxX = container.clientWidth - noBtn.clientWidth - 20;
  const maxY = container.clientHeight - noBtn.clientHeight - 20;
  const x = Math.random() * maxX;
  const y = Math.random() * maxY;
  noBtn.style.position='absolute';
  noBtn.style.left = x + 'px';
  noBtn.style.top = y + 'px';
}
noBtn.addEventListener('mouseenter', moveNoButton);
noBtn.addEventListener('touchstart', e=>{ e.preventDefault(); moveNoButton(); });

// YES button beep
yesBtn.addEventListener('click', ()=> beep(0.3, 500, 100));
</script>

</body>
</html>
